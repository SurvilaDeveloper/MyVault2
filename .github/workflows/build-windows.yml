name: Compilar MyVault2 para Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Descargar código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas
        run: npm test

      - name: Revisar código
        run: npm run lint

      - name: Generar instalador y versión portable
        run: npm run dist -- --publish never

      - name: Verificar archivos y generar sumas SHA-256
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (node -p "JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version").Trim()
          $filenames = @("MyVault2-Setup-$version.exe", "MyVault2-Portable-$version.exe")
          $checksums = foreach ($filename in $filenames) {
            $file = Join-Path 'dist' $filename
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
              throw "No se generó el archivo esperado: $file"
            }
            $hash = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $filename"
          }
          $checksums | Set-Content -LiteralPath 'dist/SHA256SUMS.txt' -Encoding ascii

      - name: Guardar ejecutables para revisión
        uses: actions/upload-artifact@v7
        with:
          name: MyVault2-Windows-${{ github.run_number }}
          path: |
            dist/MyVault2-Setup-*.exe
            dist/MyVault2-Portable-*.exe
            dist/SHA256SUMS.txt
            LICENSE
          if-no-files-found: error
          retention-days: 14
